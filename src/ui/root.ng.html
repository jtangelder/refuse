<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    class="presets-sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [autoFocus]="isMobile() ? 'first-tabbable' : false"
  >
    <fuse-sidebar [isMobile]="isMobile()" (presetSelected)="onPresetSelected()" (closeDrawer)="sidenav.close()"></fuse-sidebar>
  </mat-sidenav>
  <mat-sidenav-content class="dashboard-content">
    <fuse-dashboard [isMobile]="isMobile()" (toggleSidebar)="sidenav.toggle()"></fuse-dashboard>
  </mat-sidenav-content>
</mat-sidenav-container>
