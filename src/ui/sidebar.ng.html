<nav class="sidebar-container" aria-label="Preset list">
  <div class="presets-list-scroll">
    <ul class="preset-items" role="list" (keydown)="onListKeyDown($event)">
      @for (slot of allPresetSlots(); track slot) {
        <li class="preset-row">
          <button
            type="button"
            [attr.data-slot]="slot"
            (click)="changePreset(slot)"
            [class.active]="service.currentPresetSlot() === slot"
            [attr.aria-current]="service.currentPresetSlot() === slot ? 'true' : null"
            class="preset-item-btn"
            [attr.aria-label]="
              'Select preset ' + (slot + 1) + ': ' + (service.presets().get(slot)?.name || 'Preset ' + (slot + 1))
            "
          >
            <span class="slot-num">{{ slot + 1 | number: '2.0' }}</span>
            <span class="preset-name">{{ service.presets().get(slot)?.name || 'Preset ' + (slot + 1) }}</span>
          </button>
        </li>
      }
    </ul>
  </div>

  <!-- Bottom Actions -->
  <div class="sidebar-bottom-controls">
    <button
      matButton="tonal"
      class="action-pill-btn"
      (click)="openSaveDialog()"
      matTooltip="Save preset to amplifier"
    >
      <mat-icon aria-hidden="true">save</mat-icon>
      <span>Save</span>
    </button>
    <button
      matButton="tonal"
      class="action-pill-btn"
      (click)="fileInput.click()"
      matTooltip="Import .fuse or .xml preset"
    >
      <mat-icon aria-hidden="true">file_upload</mat-icon>
      <span>Import</span>
    </button>
    <button
      matButton="tonal"
      class="action-pill-btn"
      (click)="exportFusePreset()"
      matTooltip="Export .fuse preset"
    >
      <mat-icon aria-hidden="true">file_download</mat-icon>
      <span>Export</span>
    </button>
    <input #fileInput type="file" accept=".fuse,.xml" (change)="importFusePreset($event)" style="display: none;" />
  </div>
</nav>

<ng-template #saveDialogTpl>
  <h2 mat-dialog-title>Save Preset</h2>
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="dialog-full-width">
      <mat-label>Preset Name</mat-label>
      <input
        #presetNameInput
        matInput
        type="text"
        maxlength="32"
        required
        [value]="draftName()"
        (input)="onDraftNameInput($event)"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" [mat-dialog-close]="'save'">Save</button>
  </mat-dialog-actions>
</ng-template>
